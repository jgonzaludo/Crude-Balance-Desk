name: Weekly Read (AI)

"on":
  schedule:
    - cron: '0 14 * * 4'   # Thursday 14:00 UTC = ~9-10am ET
  workflow_dispatch:         # lets you click "Run workflow" manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate weekly read
        run: node weekly-read.mjs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}